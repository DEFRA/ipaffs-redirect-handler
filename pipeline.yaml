trigger:
  branches:
    include:
      - '*'

pr:
  branches:
    exclude:
      - '*'

pool:
  name: 'DEFRA-COMMON-UBUNTU-SSV5'

resources:
  repositories:
    - repository: ipaffs-infra
      type: github
      endpoint: DEFRA
      name: DEFRA/ipaffs-infra
      ref: refs/heads/main

    - repository: ipaffs-manifest
      type: github
      endpoint: DEFRA
      name: DEFRA/ipaffs-manifest
      ref: refs/heads/master

variables:
  - group: "DEV"
  - name: serviceName
    value: ipaffs-redirect-handler
  - name: nodeVersion
    value: 24.13.1
  - name: dockerFile
    value: service/Dockerfile
  - name: updateManifest
    value: false

stages:
  - template: /pipelines/templates/node-template.yaml@ipaffs-infra
    parameters:
      environmentName: "DEV"
      nodeVersion: "${{ variables.nodeVersion }}"
      serviceName: "${{ variables.serviceName }}"
      dockerFile: "${{ variables.dockerFile }}"
      runPlaywrightTests: true
      sonarAnalysis: true
      sonarReferenceBranch: master
